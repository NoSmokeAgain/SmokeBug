<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}html{height:100%}</style>
<title>菸蟲退散</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-screen arcade — HUD on top, 3×3 alveoli holes on an X-ray lightbox whose lungs heal from soot-brown to pink, news ticker at bottom. Deliberate single dark look. */
:root{
  --bg:#0d1719; --film:#18292d; --line:#2a4146;
  --ink:#e9f0ea; --mute:#8aa3a0; --filter:#e8a33d; --lung:#e88a7c;
  --danger:#ff5b4f; --good:#7fd69a; --slipper:#2f6fd6; --paper:#f3efe6;
  --f-display:"Huninn","Noto Sans TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column;max-width:480px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 10px;gap:10px;box-sizing:border-box}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:end}
.days{display:flex;align-items:baseline;gap:6px;font-family:var(--f-display);min-width:0}
.days .lbl{color:var(--mute);font-size:15px;white-space:nowrap}
.days b{font-family:var(--f-num);font-size:42px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;display:inline-block}
.days b.bump{animation:bump .25s}
@keyframes bump{40%{transform:scale(1.25);color:var(--good)}}
.stats{text-align:right;font-size:12px;color:var(--mute);display:grid;gap:2px}
.stats b{font-family:var(--f-num);color:var(--filter);font-size:15px;font-variant-numeric:tabular-nums}
.meter{grid-column:1/-1;display:grid;gap:4px}
.mlbl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);letter-spacing:.08em}
.mlbl b{font-family:var(--f-num);color:var(--ink)}
.bar{height:10px;border-radius:6px;background:var(--film);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--filter),var(--danger));transition:width .15s}
.bar.hot i{animation:pulse .5s infinite alternate}
@keyframes pulse{to{filter:brightness(1.6)}}
.goal{grid-column:1/-1;position:relative;height:18px}
.goal .track{position:absolute;left:0;right:0;top:7px;height:4px;background:var(--film);border-radius:2px}
.goal .track i{display:block;height:100%;width:0;background:var(--good);border-radius:2px;transition:width .2s}
.goal .tick{position:absolute;top:0;transform:translateX(-50%);font:500 9px var(--f-num);color:var(--mute);padding-top:12px;white-space:nowrap}
.goal .tick::before{content:"";position:absolute;left:50%;top:4px;width:2px;height:10px;background:var(--line)}
.goal .tick.done{color:var(--good)} .goal .tick.done::before{background:var(--good)}

/* Field */
.field{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at 50% 45%,#1d353a 0%,var(--bg) 70%);border-radius:18px;border:1px solid var(--line);--v:0}
.field::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:8;
  box-shadow:inset 0 0 60px rgba(255,60,40,var(--v))}
.field.shake{animation:fshake .18s}
@keyframes fshake{25%{transform:translate(-4px,2px)}50%{transform:translate(3px,-3px)}75%{transform:translate(-2px,1px)}}
.lungs{position:absolute;inset:6% 4%;pointer-events:none;opacity:.22;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.035)}}
.lungs svg{width:100%;height:100%}
.grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4%;width:min(100%,58vh,400px);padding:4%;box-sizing:border-box}
.hole{position:relative;aspect-ratio:1;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation;max-width:100%}
.hole:focus-visible{outline:2px solid var(--filter);border-radius:12px}
.pit{position:absolute;left:8%;right:8%;bottom:6%;height:26%;border-radius:50%;
  background:radial-gradient(ellipse at 50% 40%,#050a0b 55%,#3a2a2a 100%);box-shadow:0 2px 0 #5a3b38}
.mask{position:absolute;left:0;right:0;top:-10%;bottom:19%;overflow:hidden}
.critter{position:absolute;left:18%;right:18%;bottom:0;height:88%;transform:translateY(105%);transition:transform .13s cubic-bezier(.3,1.6,.6,1)}
.critter svg{width:100%;height:100%;display:block;overflow:visible;transform-origin:50% 100%}
.critter.up{transform:translateY(0)}
.critter.up svg{animation:wiggle .42s ease-in-out infinite alternate}
.critter.up.tempt svg{animation:glow .6s ease-in-out infinite alternate}
@keyframes wiggle{from{transform:rotate(-5deg) scaleY(1)}to{transform:rotate(5deg) scaleY(1.04)}}
@keyframes glow{to{filter:drop-shadow(0 0 8px #ff9a3a)}}
.critter.hit{transition:none;animation:squish .24s forwards}
@keyframes squish{0%{transform:translateY(0) scale(1)}35%{transform:translateY(10%) scale(1.35,.5)}100%{transform:translateY(105%) scale(1)}}
.critter.shake svg{animation:shake .25s}
@keyframes shake{25%{transform:translateX(-8%) rotate(-10deg)}75%{transform:translateX(8%) rotate(10deg)}}
.smoke{animation:drift 1.4s ease-in-out infinite}
@keyframes drift{50%{transform:translate(3px,-5px);opacity:.4}}
.bubble{position:absolute;left:50%;bottom:92%;transform:translate(-50%,6px) scale(.8);min-width:max-content;
  background:var(--paper);color:#1c1c1c;font:500 11px/1.3 var(--f-display);padding:4px 8px;border-radius:10px;
  opacity:0;transition:opacity .12s,transform .15s cubic-bezier(.3,1.6,.6,1);pointer-events:none;z-index:3;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-4px;border:4px solid transparent;border-top-color:var(--paper)}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.hole:nth-child(3n+1) .bubble{left:20%;transform:translate(-20%,6px) scale(.8)}
.hole:nth-child(3n+1) .bubble.on{transform:translate(-20%,0) scale(1)}
.hole:nth-child(3n+1) .bubble::after{left:30%}
.hole:nth-child(3n) .bubble{left:80%;transform:translate(-80%,6px) scale(.8)}
.hole:nth-child(3n) .bubble.on{transform:translate(-80%,0) scale(1)}
.hole:nth-child(3n) .bubble::after{left:70%}
.hole.tempt .bubble{background:var(--filter)} .hole.tempt .bubble::after{border-top-color:var(--filter)}

.slipper{position:absolute;width:24%;max-width:100px;pointer-events:none;z-index:5;opacity:0;transform-origin:20% 90%}
.slipper.go{animation:slap .24s ease-out}
@keyframes slap{0%{opacity:1;transform:rotate(-60deg) translateY(-25%)}40%{opacity:1;transform:rotate(10deg) scale(1.1)}100%{opacity:0;transform:rotate(0)}}
.fx{position:absolute;pointer-events:none;z-index:6}
.float{font:700 18px var(--f-num);animation:up .8s forwards;white-space:nowrap;transform:translateX(-50%)}
.float.good{color:var(--good)} .float.bad{color:var(--danger)} .float.cool{color:#9fd8ff}
@keyframes up{to{transform:translate(-50%,-52px);opacity:0}}
.bam{font:400 26px var(--f-display);color:var(--paper);-webkit-text-stroke:1px #0d1719;transform:translate(-50%,-50%);animation:bam .35s forwards;white-space:nowrap}
@keyframes bam{0%{transform:translate(-50%,-50%) scale(.3) rotate(-15deg)}40%{transform:translate(-50%,-50%) scale(1.2) rotate(-8deg)}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}
.pt{width:9px;height:9px;border-radius:50%;animation:burst .55s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.pop{left:50%;top:42%;font:400 40px var(--f-display);color:var(--filter);-webkit-text-stroke:1.5px #0d1719;transform:translate(-50%,-50%);animation:pop .9s forwards;white-space:nowrap;z-index:7}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.2)}25%{transform:translate(-50%,-50%) scale(1.15)}70%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
.cough{inset:0;border-radius:18px;background:radial-gradient(circle at 50% 50%,#9aa3a0cc,#5b6462aa 60%,transparent 90%);
  display:flex;align-items:center;justify-content:center;font:400 34px var(--f-display);color:#1c1c1c;animation:cough 1.1s forwards;z-index:7}
@keyframes cough{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
.toast{position:absolute;left:12px;right:12px;top:12px;z-index:7;background:var(--paper);color:#1d1d1d;border-radius:14px;
  padding:10px 14px;box-shadow:0 8px 24px #0008;display:grid;gap:2px;animation:drop .3s ease-out}
.toast b{font:400 18px var(--f-display);color:#2b7a4b}
.toast span{font-size:13px;line-height:1.45}
@keyframes drop{from{transform:translateY(-16px);opacity:0}}
.mute{position:absolute;right:8px;bottom:8px;z-index:9;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
  background:var(--film);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.mute svg{width:20px;height:20px}
.mute:focus-visible{outline:2px solid var(--filter)}

/* Ticker */
.ticker{display:flex;gap:8px;align-items:center;font-size:13px;min-height:32px;background:var(--film);border-radius:10px;padding:6px 10px;border:1px solid var(--line)}
.ticker .tag{flex:none;background:var(--danger);color:#fff;font:700 11px var(--f-body);letter-spacing:.08em;padding:2px 6px;border-radius:4px}
#news{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Overlays */
.ov{position:fixed;inset:0;z-index:20;background:#0d1719f0;display:flex;align-items:flex-start;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;overflow:auto}
.card{width:100%;max-width:400px;display:grid;gap:16px;text-align:left;margin:auto 0}
.card h1{font:400 52px/1.05 var(--f-display);margin:0;letter-spacing:.02em;text-wrap:balance}
.card h1 em{font-style:normal;color:var(--filter)}
.card .lead{margin:0;color:var(--mute);font-size:15px;line-height:1.6}
.langs{display:inline-grid;grid-template-columns:repeat(3,auto);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;justify-self:start}
.langs button{font:500 14px var(--f-body);background:transparent;color:var(--mute);border:0;padding:7px 14px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--filter);color:#1a1205}
.langs button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;font-size:14px;line-height:1.45}
.rules li svg{width:44px;height:44px}
.rules b{color:var(--ink)} .rules span{color:var(--mute)}
.btn{font:400 22px var(--f-display);border:0;border-radius:14px;padding:14px;cursor:pointer;background:var(--filter);color:#1a1205;
  box-shadow:0 4px 0 #9b6416;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9b6416}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font:500 15px var(--f-body);padding:10px}
.best{font:500 12px var(--f-num);color:var(--mute)}
.result{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.result div{background:var(--film);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px;min-width:0}
.result small{color:var(--mute);font-size:11px}
.result b{font:700 17px var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.quote{margin:0;padding:12px 14px;background:var(--film);border-radius:12px;font:400 16px/1.5 var(--f-display);color:var(--ink)}
.quote small{display:block;color:var(--mute);font:12px var(--f-body);margin-top:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.note{font-size:11px;color:var(--mute);line-height:1.5;margin:0;-webkit-user-select:text;user-select:text;white-space:pre-line}
@media (prefers-reduced-motion:reduce){.smoke,.bar.hot i,.lungs,.critter.up svg{animation:none}.toast{animation:none}.field.shake{animation:none}}
</style>
</head>
<body>

<div class="app">
  <header class="hud">
    <div class="days"><span class="lbl" id="lDayPre">戒菸第</span><b id="days">0</b><span class="lbl" id="lDayPost">天</span></div>
    <div class="stats"><div><span id="lSaved">省下</span> <b id="money">NT$0</b></div><div><span id="lCombo">連擊</span> <b id="combo">0</b></div></div>
    <div class="meter">
      <div class="mlbl"><span id="lCrave">菸癮</span><b id="cpct">0%</b></div>
      <div class="bar" id="cbarWrap"><i id="cbar"></i></div>
    </div>
    <div class="goal" id="goal"><div class="track"><i id="gbar"></i></div></div>
  </header>

  <main class="field" id="field">
    <div class="lungs" aria-hidden="true">
      <svg viewBox="0 0 200 180" preserveAspectRatio="xMidYMid meet"><g id="lungFill" fill="#7a6250">
        <rect x="96" y="0" width="8" height="60" rx="4"/>
        <path d="M92 58 C70 40 30 50 18 100 C8 140 20 175 55 176 C85 177 92 150 92 120Z"/>
        <path d="M108 58 C130 40 170 50 182 100 C192 140 180 175 145 176 C115 177 108 150 108 120Z"/></g></svg>
    </div>
    <div class="grid" id="grid"></div>
    <svg class="slipper" id="slipper" viewBox="0 0 100 60" aria-hidden="true">
      <ellipse cx="50" cy="34" rx="46" ry="20" fill="#f6f6f2" stroke="#2f6fd6" stroke-width="4"/>
      <path d="M30 18 Q50 46 70 18" fill="none" stroke="#2f6fd6" stroke-width="10" stroke-linecap="round"/>
    </svg>
    <button class="mute" id="muteBtn" aria-label="聲音"></button>
  </main>

  <footer class="ticker"><span class="tag" id="lNews">最新消息</span><span id="news"></span></footer>
</div>

<div class="ov" id="startOv">
  <div class="card">
    <div class="langs" data-langs></div>
    <h1 id="sTitle"></h1>
    <p class="lead" id="sLead"></p>
    <ul class="rules" id="rules"></ul>
    <button class="btn" id="startBtn"></button>
    <div class="best" id="bestStart"></div>
  </div>
</div>

<div class="ov" id="endOv" hidden>
  <div class="card">
    <div class="langs" data-langs></div>
    <h1 id="endTitle"></h1>
    <p class="lead" id="endLead"></p>
    <div class="result">
      <div><small id="lrD"></small><b id="rDays">0</b></div>
      <div><small id="lrK"></small><b id="rKills">0</b></div>
      <div><small id="lrM"></small><b id="rMoney">0</b></div>
    </div>
    <p class="quote" id="endQuote"></p>
    <div class="row">
      <button class="btn ghost" id="copyBtn"></button>
      <button class="btn" id="againBtn"></button>
    </div>
    <p class="note" id="shareText" hidden></p>
    <p class="note" id="endNote"></p>
  </div>
</div>

<script>
(()=>{
const GOAL=365, PACK=125, SITE='https://nosmokeagain.github.io/SmokeBug/';
const $=id=>document.getElementById(id);
const fmt=n=>'NT$'+n.toLocaleString('en-US');

/* ================= i18n ================= */
const I18N={
zh:{
 name:'菸蟲<em>退散</em>',lead:'你肺裡住著一群菸蟲，每天勸你「再一根就好」。拿起藍白拖，撐到戒菸滿一年。',
 start:'開始戒菸',again:'再戒一次',best:n=>`最佳紀錄：戒菸 ${n} 天`,

 comboPop:n=>`${n} 連擊！`,temptLbl:'最後一根',gumLbl:'口香糖',

 nIntro:'菸蟲在你肺裡開派對，拿起藍白拖。',nStart:'戒菸第一天。菸蟲們還不知道你是認真的。',nSmoked:'你抽了「最後一根」。菸蟲們集體鼓掌。',nGum:'嚼口香糖，嘴巴有事做，菸蟲閉嘴三秒。',

  refuse:['你看著「最後一根」，然後走開了','誘惑自動熄滅，你忍住了','朋友收回香菸，你保住面子跟肺']},
 MS:[['戒菸 24 小時','血中一氧化碳回到正常。菸蟲開始覺得房租變貴了。'],['戒菸 3 天','尼古丁大致排出體外。接下來菸蟲會特別吵，正常現象。'],['戒菸 2 週','血液循環開始改善，爬樓梯比較不喘。老菸蟲坐不住了。'],['戒菸 1 個月','咳嗽和呼吸短促逐漸減少。已經省下 NT$3,750。'],['戒菸 3 個月','肺功能明顯提升。菸蟲開始互相推卸責任。'],['戒菸半年','省下 NT$22,500，夠換一支新手機。']],
 rD:'戒菸天數',rK:'拍死菸蟲',rM:'省下',copy:'複製戰績',copied:'已複製',hold:'請長按複製',

const holes=[];
for(let i=0;i<9;i++){
  const b=document.createElement('button');b.className='hole';b.id='hole'+i;b.setAttribute('aria-label','#'+(i+1));
  b.innerHTML='<div class="pit"></div><div class="mask"><div class="critter"></div></div><div class="bubble"></div>';
  grid.appendChild(b);
  const h={el:b,cr:b.querySelector('.critter'),bb:b.querySelector('.bubble'),type:null,hp:0,t:null,lock:0,bt:null};
  b.addEventListener('pointerdown',e=>{e.preventDefault();hit(h)});
  b.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();hit(h)}});
  holes.push(h);
}
let S={};
function reset(){S={run:false,days:0,crave:0,combo:0,kills:0,refused:0,smoked:0,msi:0,last:0,spawnT:null}}
reset();
const pick=a=>a[Math.random()*a.length|0];
function prog(){return Math.min(S.days/GOAL,1)}

/* ================= fx ================= */
function rel(h,fx=.5,fy=.4){const r=h.el.getBoundingClientRect(),f=field.getBoundingClientRect();return[r.left-f.left+r.width*fx,r.top-f.top+r.height*fy,r.width]}
function fx(cls,html,x,y,life){const d=document.createElement('div');d.className='fx '+cls;d.innerHTML=html;if(x!=null){d.style.left=x+'px';d.style.top=y+'px'}field.appendChild(d);setTimeout(()=>d.remove(),life);return d}
function say(h,txt,kind,ms=1000){h.bb.textContent=txt;h.bb.classList.add('on');clearTimeout(h.bt);h.bt=setTimeout(()=>h.bb.classList.remove('on'),ms);babble(txt,kind)}
function news(t){$('news').textContent=t}
function floatAt(h,txt,cls){const[x,y]=rel(h,.5,.1);fx('float '+cls,txt,x,y,820)}
function particles(h,colors,n=10){
  const[x,y,w]=rel(h,.5,.55);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,r=w*(.35+Math.random()*.45);
    const p=fx('pt','',x,y,600);p.style.background=pick(colors);p.style.setProperty('--dx',Math.cos(a)*r+'px');p.style.setProperty('--dy',Math.sin(a)*r-w*.2+'px')}
}
function slap(h){
  const[x,y]=rel(h,.25,.05);slipper.style.left=x+'px';slipper.style.top=y+'px';
  slipper.classList.remove('go');void slipper.offsetWidth;slipper.classList.add('go');
}
function shakeField(){field.classList.remove('shake');void field.offsetWidth;field.classList.add('shake')}
function lerpHex(a,b,t){const p=x=>[1,3,5].map(i=>parseInt(x.slice(i,i+2),16));const A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

/* ================= game ================= */
function chooseType(){
  const r=Math.random(),p=prog();
  const wT=.15+.08*p,wG=.08,wE=S.days>=14?.14+.08*p:0;
  if(r<wT)return'tempt';if(r<wT+wG)return'gum';if(r<wT+wG+wE)return'elder';return'bug';
}
function spawn(){
  const now=performance.now(),free=holes.filter(h=>!h.type&&now>h.lock);if(!free.length)return;
  const h=pick(free),type=chooseType();
  h.type=type;h.hp=type==='elder'?2:1;h.el.classList.toggle('tempt',type==='tempt');
  h.cr.className='critter';h.cr.innerHTML=SPR[type]();void h.cr.offsetWidth;h.cr.classList.add('up');if(type==='tempt')h.cr.classList.add('tempt');
  tone(type==='elder'?180:type==='tempt'?260:420,.06,'triangle',.03,type==='gum'?900:600);
  if(type==='tempt'||Math.random()<.5)say(h,pick(T().L[type]),type,1100);
  const p=prog();let stay=1500-620*p;if(type==='tempt')stay+=500;if(type==='gum')stay-=200;if(type==='elder')stay+=350;
  h.t=setTimeout(()=>expire(h),stay);
}
function schedule(){
  if(!S.run)return;spawn();
  const p=prog();if(p>.35&&Math.random()<.3+.3*p)setTimeout(()=>S.run&&spawn(),120);
  S.spawnT=setTimeout(schedule,900-430*p+Math.random()*200);
}
function down(h,cls){clearTimeout(h.t);h.type=null;h.el.classList.remove('tempt');
  if(cls){h.cr.classList.remove('up');h.cr.classList.add(cls)}else h.cr.classList.remove('up','tempt');h.lock=performance.now()+260}
function expire(h){
  if(!S.run||!h.type)return;const t=h.type;down(h);
  if(t==='bug'||t==='elder'){S.crave+=t==='elder'?16:11;S.combo=0;news(pick(T().L.escape));floatAt(h,T().craveUp,'bad');sfx.escape()}
  else if(t==='tempt'){S.refused++;news(pick(T().L.refuse))}
  render();
}
function hit(h){
  if(!S.run)return;slap(h);sfx.slap();
  const[x,y]=rel(h,.5,.35);
  if(!h.type){fx('bam',T().slap,x,y,360);return}
  const t=h.type;
  if(t==='bug'||t==='elder'){
    h.hp--;
    if(h.hp>0){say(h,pick(T().L.elderHit),'elder',700);sfx.elderHit();h.cr.classList.remove('shake');void h.cr.offsetWidth;h.cr.classList.add('shake');
      particles(h,['#a9a59c','#cfd8d6'],5);clearTimeout(h.t);h.t=setTimeout(()=>expire(h),750);return}
    const add=(t==='elder'?8:3)+(S.combo>=5?2:0);
    S.combo++;S.kills++;S.days=Math.min(GOAL,S.days+add);
    fx('bam',T().slap,x,y,360);say(h,pick(T().L.ouch),'ouch',600);down(h,'hit');sfx.kill();buzz(15);shakeField();
    particles(h,t==='elder'?['#a9a59c','#9a6a2a','#cfd8d6']:['#e8a33d','#f3efe6','#cfd8d6']);
    floatAt(h,T().plus(add),'good');
    const db=$('days');db.classList.remove('bump');void db.offsetWidth;db.classList.add('bump');
    if(S.combo>=5&&S.combo%5===0){fx('pop',T().comboPop(S.combo),null,null,950);sfx.combo()}
    checkMS();
  }else if(t==='tempt'){
    S.smoked++;S.crave+=24;S.combo=0;down(h,'hit');sfx.bad();buzz([40,40,80]);shakeField();
    fx('cough',T().cough,null,null,1150);floatAt(h,T().smokedF,'bad');news(T().nSmoked);
  }else if(t==='gum'){
    S.crave=Math.max(0,S.crave-20);down(h,'hit');sfx.gum();particles(h,['#2fa36b','#b9efcf'],8);floatAt(h,T().gumF,'cool');news(T().nGum);
  }
  render();
  if(S.days>=GOAL)end(true);
}
function checkMS(){
  while(S.msi<MSD.length&&S.days>=MSD[S.msi]){
    const [t,m]=T().MS[S.msi++];sfx.ms();news(t+'：'+m);
    const old=field.querySelector('.toast');if(old)old.remove();
    const d=document.createElement('div');d.className='toast';d.innerHTML=`<b>${t}</b><span>${m}</span>`;
    field.appendChild(d);setTimeout(()=>d.remove(),2600);
  }
}
function render(){
  S.crave=Math.max(0,Math.min(100,S.crave));
  $('days').textContent=S.days;$('money').textContent=fmt(S.days*PACK);$('combo').textContent=S.combo;
  $('cpct').textContent=Math.round(S.crave)+'%';$('cbar').style.width=S.crave+'%';
  $('cbarWrap').classList.toggle('hot',S.crave>70);
  $('gbar').style.width=(S.days/GOAL*100)+'%';
  goal.querySelectorAll('.tick').forEach(t=>t.classList.toggle('done',S.days>=+t.dataset.d));
  $('lungFill').setAttribute('fill',lerpHex('#7a6250','#ff8f86',prog()));
  field.style.setProperty('--v',Math.max(0,(S.crave-50)/50*.55).toFixed(3));
}
function frame(ts){
  if(!S.run)return;const dt=S.last?(ts-S.last)/1000:0;S.last=ts;
  S.crave-=0.9*dt;render();
  if(S.crave>=100){end(false);return}
  requestAnimationFrame(frame);
}
function start(){
  initAudio();
  holes.forEach(h=>{clearTimeout(h.t);h.type=null;h.cr.className='critter';h.bb.classList.remove('on');h.el.classList.remove('tempt')});
  field.querySelectorAll('.fx,.toast').forEach(n=>n.remove());
  reset();S.run=true;render();news(T().nStart);
  $('startOv').hidden=true;$('endOv').hidden=true;
  bgmStart();setTimeout(schedule,500);requestAnimationFrame(frame);
}
let lastWin=false;
function end(win){
  S.run=false;lastWin=win;clearTimeout(S.spawnT);bgmStop();holes.forEach(h=>{clearTimeout(h.t);if(h.type)down(h)});
  win?sfx.win():sfx.lose();
  if(S.days>best){best=S.days;try{localStorage.setItem('smokebug_best',best)}catch(e){}}
  fillEnd();$('shareText').hidden=true;$('endOv').hidden=false;
}
function fillEnd(){
  const L=T();
  $('rDays').textContent=S.days;$('rKills').textContent=S.kills;$('rMoney').textContent=fmt(S.days*PACK);
  $('lrD').textContent=L.rD;$('lrK').textContent=L.rK;$('lrM').textContent=L.rM;
  if(lastWin){$('endTitle').textContent=L.winT[S.smoked===0?0:S.smoked<=2?1:2];$('endLead').textContent=L.winLead(S.smoked);
    $('endQuote').innerHTML=`「${L.winQ}」<small>— ${L.winWho}</small>`}
  else{$('endTitle').textContent=L.loseT;$('endLead').textContent=L.loseLead(S.days);
    $('endQuote').innerHTML=`「${L.loseQ(S.days)}」<small>— ${L.loseWho}</small>`}
  $('copyBtn').textContent=L.copy;$('againBtn').textContent=L.again;$('endNote').textContent=L.note;
}
$('copyBtn').addEventListener('click',()=>{
  const t=T().share(lastWin,S.days,S.kills)+'\n'+SITE,el=$('shareText');
  const fallback=()=>{el.hidden=false;el.textContent=t;const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);$('copyBtn').textContent=T().hold};
  try{navigator.clipboard.writeText(t).then(()=>{$('copyBtn').textContent=T().copied},fallback)}catch(e){fallback()}
});

/* ================= language ================= */
function applyLang(){
  const L=T();document.documentElement.lang=lang==='en'?'en':lang==='tw'?'nan-Hant-TW':'zh-Hant';
  $('sTitle').innerHTML=L.name;$('sLead').textContent=L.lead;$('startBtn').textContent=L.start;
  $('bestStart').textContent=best?L.best(best):'';
  $('rules').innerHTML=L.rules.map(([b,s],i)=>`<li>${SPR[['bug','elder','tempt','gum','warn'][i]]()}<div><b>${b}</b><br><span>${s}</span></div></li>`).join('');
  $('lDayPre').textContent=L.dayPre;$('lDayPost').textContent=L.dayPost;$('lSaved').textContent=L.saved;$('lCombo').textContent=L.combo;
  $('lCrave').textContent=L.crave;$('lNews').textContent=L.news;$('muteBtn').setAttribute('aria-label',L.sound);
  goal.querySelectorAll('.tick').forEach(t=>t.textContent=+t.dataset.d===GOAL?L.year:L.tick(+t.dataset.d));
  if(!S.run)news(L.nIntro);
  if(!$('endOv').hidden)fillEnd();
  document.querySelectorAll('[data-langs] button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===lang?'true':'false'));
}
document.querySelectorAll('[data-langs]').forEach(box=>{
  box.innerHTML=[['zh','中文'],['tw','台語'],['en','EN']].map(([k,n])=>`<button data-l="${k}" aria-pressed="false">${n}</button>`).join('');
  box.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;lang=b.dataset.l;try{localStorage.setItem('smokebug_lang',lang)}catch(e){}
    applyLang();initAudio();babble('哈哈哈','bug')});
});
$('muteBtn').addEventListener('click',()=>{initAudio();setMute(!muted)});
$('startBtn').addEventListener('click',start);
$('againBtn').addEventListener('click',start);
setMute(muted);applyLang();render();
})();
</script>
</body>
</html>
